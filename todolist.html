<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Advanced Todo Card - Stage 1a</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
	<style>
		:root {
			--bg-a: #f8fafc;
			--bg-b: #dbeafe;
			--card: #ffffff;
			--text: #0f172a;
			--muted: #475569;
			--line: #cbd5e1;
			--focus: #0f766e;
			--danger: #b91c1c;
			--danger-bg: #fee2e2;
			--pending-bg: #fef9c3;
			--pending-text: #854d0e;
			--progress-bg: #dbeafe;
			--progress-text: #1d4ed8;
			--done-bg: #dcfce7;
			--done-text: #166534;
			--low: #15803d;
			--medium: #b45309;
			--high: #be123c;
			--shadow: 0 18px 40px rgba(15, 23, 42, 0.14);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			padding: 1rem;
			font-family: "Public Sans", sans-serif;
			color: var(--text);
			background:
				radial-gradient(circle at 85% 8%, rgba(14, 165, 233, 0.28), transparent 35%),
				radial-gradient(circle at 15% 92%, rgba(251, 191, 36, 0.22), transparent 40%),
				linear-gradient(165deg, var(--bg-a), var(--bg-b));
			display: grid;
			place-items: center;
		}

		.todo-card {
			width: 100%;
			max-width: 500px;
			background: var(--card);
			border: 1px solid var(--line);
			border-left: 8px solid var(--medium);
			border-radius: 18px;
			box-shadow: var(--shadow);
			padding: 1rem;
			display: grid;
			gap: 0.9rem;
		}

		.todo-card.priority-low {
			border-left-color: var(--low);
		}

		.todo-card.priority-medium {
			border-left-color: var(--medium);
		}

		.todo-card.priority-high {
			border-left-color: var(--high);
		}

		.todo-card.overdue {
			box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.18), var(--shadow);
		}

		.todo-card.done {
			opacity: 0.94;
		}

		.todo-header {
			display: flex;
			gap: 0.65rem;
			align-items: flex-start;
		}

		.priority-indicator {
			inline-size: 0.95rem;
			block-size: 0.95rem;
			border-radius: 50%;
			margin-top: 0.35rem;
			background: var(--medium);
			flex: 0 0 auto;
			box-shadow: 0 0 0 2px #ffffff, 0 0 0 3px rgba(15, 23, 42, 0.14);
		}

		.priority-indicator.low {
			background: var(--low);
		}

		.priority-indicator.medium {
			background: var(--medium);
		}

		.priority-indicator.high {
			background: var(--high);
		}

		.todo-title-wrap {
			min-width: 0;
			flex: 1;
		}

		.todo-title {
			margin: 0;
			font-family: "Outfit", sans-serif;
			line-height: 1.2;
			font-size: clamp(1.2rem, 3vw, 1.55rem);
			word-break: break-word;
		}

		.todo-title.done {
			text-decoration: line-through;
			color: var(--muted);
		}

		.meta-row {
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
			align-items: center;
		}

		.badge {
			border-radius: 999px;
			padding: 0.28rem 0.68rem;
			font-size: 0.88rem;
			font-weight: 700;
			border: 1px solid transparent;
			white-space: nowrap;
		}

		.priority-badge {
			background: #fff7ed;
			color: #9a3412;
			border-color: #fed7aa;
		}

		.status-badge.pending {
			background: var(--pending-bg);
			color: var(--pending-text);
			border-color: #fde68a;
		}

		.status-badge.in-progress {
			background: var(--progress-bg);
			color: var(--progress-text);
			border-color: #bfdbfe;
		}

		.status-badge.done {
			background: var(--done-bg);
			color: var(--done-text);
			border-color: #bbf7d0;
		}

		.time-row {
			display: grid;
			gap: 0.24rem;
			color: var(--muted);
			font-size: 0.95rem;
		}

		.time-row strong {
			color: var(--text);
			font-size: 0.97rem;
		}

		.time-remaining {
			font-weight: 700;
		}

		.overdue-indicator {
			display: inline-flex;
			align-items: center;
			width: fit-content;
			border-radius: 999px;
			padding: 0.2rem 0.6rem;
			border: 1px solid #fecaca;
			background: #fff1f2;
			color: var(--danger);
			font-size: 0.85rem;
			font-weight: 700;
		}

		.overdue-indicator:not(.active) {
			border-color: #d1fae5;
			background: #ecfdf5;
			color: #047857;
		}

		.collapsible-section {
			overflow: hidden;
			transition: max-height 220ms ease;
		}

		.collapsible-section.collapsed {
			max-height: 4.2rem;
			position: relative;
		}

		.collapsible-section.collapsed::after {
			content: "";
			position: absolute;
			inset: auto 0 0 0;
			height: 2rem;
			background: linear-gradient(180deg, rgba(255, 255, 255, 0), #ffffff);
			pointer-events: none;
		}

		.todo-description {
			margin: 0;
			line-height: 1.5;
			color: var(--muted);
			word-break: break-word;
		}

		.control-row {
			display: grid;
			gap: 0.7rem;
			align-items: center;
		}

		.toggle-row {
			display: inline-flex;
			gap: 0.5rem;
			align-items: center;
			width: fit-content;
			font-weight: 600;
		}

		.status-control-wrap {
			display: grid;
			gap: 0.3rem;
			width: fit-content;
		}

		.status-control-wrap label {
			font-size: 0.87rem;
			font-weight: 700;
			color: var(--muted);
		}

		.status-control-wrap select {
			min-width: 180px;
		}

		.expand-btn {
			justify-self: start;
		}

		input[type="checkbox"],
		input,
		textarea,
		select,
		button {
			font: inherit;
		}

		input[type="checkbox"] {
			inline-size: 1rem;
			block-size: 1rem;
			accent-color: var(--focus);
			cursor: pointer;
		}

		.tag-list {
			list-style: none;
			display: flex;
			flex-wrap: wrap;
			gap: 0.45rem;
			margin: 0;
			padding: 0;
		}

		.tag {
			border-radius: 999px;
			padding: 0.2rem 0.62rem;
			border: 1px solid #bfdbfe;
			background: #eff6ff;
			color: #1e3a8a;
			font-size: 0.84rem;
			font-weight: 700;
		}

		.actions {
			display: flex;
			flex-wrap: wrap;
			gap: 0.55rem;
		}

		.btn {
			border: 1px solid transparent;
			border-radius: 10px;
			background: #f8fafc;
			color: var(--text);
			padding: 0.5rem 0.85rem;
			font-weight: 700;
			cursor: pointer;
		}

		.btn:hover {
			background: #e2e8f0;
		}

		.btn-delete {
			background: var(--danger-bg);
			color: var(--danger);
			border-color: #fecaca;
		}

		.btn-delete:hover {
			background: #fecaca;
		}

		.edit-form {
			display: grid;
			gap: 0.7rem;
			border: 1px solid var(--line);
			border-radius: 12px;
			padding: 0.85rem;
			background: #f8fafc;
		}

		.field {
			display: grid;
			gap: 0.28rem;
		}

		.field label {
			font-weight: 700;
			font-size: 0.9rem;
			color: #334155;
		}

		input,
		textarea,
		select {
			border: 1px solid #94a3b8;
			border-radius: 8px;
			padding: 0.48rem 0.58rem;
			background: #ffffff;
			color: var(--text);
			width: 100%;
		}

		textarea {
			min-height: 96px;
			resize: vertical;
		}

		.edit-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
		}

		.is-hidden {
			display: none;
		}

		button:focus-visible,
		input:focus-visible,
		select:focus-visible,
		textarea:focus-visible {
			outline: 3px solid var(--focus);
			outline-offset: 2px;
		}

		@media (min-width: 768px) {
			.todo-card {
				padding: 1.2rem;
			}

			.control-row {
				grid-template-columns: auto auto 1fr;
				column-gap: 1rem;
			}
		}

		@media (min-width: 1024px) {
			.todo-card {
				max-width: 520px;
			}

			.meta-row {
				justify-content: flex-start;
			}
		}
	</style>
</head>
<body>
	<article class="todo-card priority-medium" data-testid="test-todo-card" aria-label="Todo item card">
		<div id="todoViewMode">
			<div class="todo-header">
				<span class="priority-indicator medium" data-testid="test-todo-priority-indicator" aria-label="Priority indicator"></span>
				<div class="todo-title-wrap">
					<h2 class="todo-title" data-testid="test-todo-title"></h2>
				</div>
			</div>

			<div class="meta-row">
				<span class="badge priority-badge" data-testid="test-todo-priority" aria-label="Todo priority"></span>
				<span class="badge status-badge" data-testid="test-todo-status" aria-label="Todo status"></span>
			</div>

			<div class="time-row">
				<strong>Deadline</strong>
				<time id="dueDateDisplay" data-testid="test-todo-due-date"></time>
				<time id="timeRemainingDisplay" class="time-remaining" data-testid="test-todo-time-remaining" aria-live="polite"></time>
				<span id="overdueIndicator" class="overdue-indicator" data-testid="test-todo-overdue-indicator">On track</span>
			</div>

			<div id="descriptionRegion" class="collapsible-section" data-testid="test-todo-collapsible-section">
				<p class="todo-description" data-testid="test-todo-description"></p>
			</div>

			<button id="expandToggleButton" class="btn expand-btn" type="button" data-testid="test-todo-expand-toggle" aria-expanded="false" aria-controls="descriptionRegion">
				Expand description
			</button>

			<div class="control-row">
				<div class="toggle-row">
					<input id="todoCompleteToggle" data-testid="test-todo-complete-toggle" type="checkbox" />
					<label for="todoCompleteToggle">Mark as complete</label>
				</div>

				<div class="status-control-wrap">
					<label for="statusControl">Status</label>
					<select id="statusControl" data-testid="test-todo-status-control" aria-label="Change todo status">
						<option>Pending</option>
						<option>In Progress</option>
						<option>Done</option>
					</select>
				</div>
			</div>

			<ul class="tag-list" role="list" data-testid="test-todo-tags" aria-label="Task tags">
				<li class="tag" data-testid="test-todo-tag-work">work</li>
				<li class="tag" data-testid="test-todo-tag-urgent">urgent</li>
				<li class="tag">design</li>
			</ul>

			<div class="actions">
				<button id="editButton" class="btn" data-testid="test-todo-edit-button" type="button">Edit</button>
				<button id="deleteButton" class="btn btn-delete" data-testid="test-todo-delete-button" type="button">Delete</button>
			</div>
		</div>

		<form id="editForm" class="edit-form is-hidden" data-testid="test-todo-edit-form" aria-label="Edit todo item">
			<div class="field">
				<label for="editTitle">Title</label>
				<input id="editTitle" data-testid="test-todo-edit-title-input" type="text" required />
			</div>

			<div class="field">
				<label for="editDescription">Description</label>
				<textarea id="editDescription" data-testid="test-todo-edit-description-input" required></textarea>
			</div>

			<div class="field">
				<label for="editPriority">Priority</label>
				<select id="editPriority" data-testid="test-todo-edit-priority-select">
					<option>Low</option>
					<option>Medium</option>
					<option>High</option>
				</select>
			</div>

			<div class="field">
				<label for="editDueDate">Due date</label>
				<input id="editDueDate" data-testid="test-todo-edit-due-date-input" type="datetime-local" required />
			</div>

			<div class="edit-actions">
				<button class="btn" data-testid="test-todo-save-button" type="submit">Save</button>
				<button id="cancelButton" class="btn" data-testid="test-todo-cancel-button" type="button">Cancel</button>
			</div>
		</form>
	</article>

	<script>
		const card = document.querySelector('[data-testid="test-todo-card"]');
		const viewMode = document.getElementById("todoViewMode");
		const editForm = document.getElementById("editForm");

		const titleElement = document.querySelector('[data-testid="test-todo-title"]');
		const descriptionElement = document.querySelector('[data-testid="test-todo-description"]');
		const priorityBadge = document.querySelector('[data-testid="test-todo-priority"]');
		const priorityIndicator = document.querySelector('[data-testid="test-todo-priority-indicator"]');
		const statusBadge = document.querySelector('[data-testid="test-todo-status"]');
		const dueDateDisplay = document.querySelector('[data-testid="test-todo-due-date"]');
		const timeRemainingDisplay = document.querySelector('[data-testid="test-todo-time-remaining"]');
		const overdueIndicator = document.querySelector('[data-testid="test-todo-overdue-indicator"]');

		const completeToggle = document.querySelector('[data-testid="test-todo-complete-toggle"]');
		const statusControl = document.querySelector('[data-testid="test-todo-status-control"]');
		const expandToggle = document.querySelector('[data-testid="test-todo-expand-toggle"]');
		const collapsible = document.querySelector('[data-testid="test-todo-collapsible-section"]');
		const editButton = document.querySelector('[data-testid="test-todo-edit-button"]');
		const deleteButton = document.querySelector('[data-testid="test-todo-delete-button"]');

		const editTitleInput = document.querySelector('[data-testid="test-todo-edit-title-input"]');
		const editDescriptionInput = document.querySelector('[data-testid="test-todo-edit-description-input"]');
		const editPriorityInput = document.querySelector('[data-testid="test-todo-edit-priority-select"]');
		const editDueDateInput = document.querySelector('[data-testid="test-todo-edit-due-date-input"]');
		const cancelButton = document.querySelector('[data-testid="test-todo-cancel-button"]');

		const COLLAPSE_THRESHOLD = 170;
		let timerId = null;

		const state = {
			title: "Ship onboarding redesign with QA checklist",
			description: "Finalize interaction notes, validate edge-case copy, attach accessibility test output, and record design sign-off notes for release. Include risks, owners, and fallback behavior for narrow screens to prevent regressions.",
			priority: "High",
			status: "In Progress",
			dueDate: new Date(Date.now() + 28 * 60 * 60 * 1000),
			isExpanded: false,
			isEditing: false
		};

		function toStatusClass(status) {
			if (status === "In Progress") {
				return "in-progress";
			}
			return status.toLowerCase();
		}

		function toPriorityClass(priority) {
			return priority.toLowerCase();
		}

		function pluralize(value, unit) {
			return `${value} ${unit}${value === 1 ? "" : "s"}`;
		}

		function formatDeadline(dateValue) {
			return `Due ${dateValue.toLocaleString(undefined, {
				month: "short",
				day: "numeric",
				year: "numeric",
				hour: "numeric",
				minute: "2-digit"
			})}`;
		}

		function formatForInput(dateValue) {
			const two = (num) => String(num).padStart(2, "0");
			const year = dateValue.getFullYear();
			const month = two(dateValue.getMonth() + 1);
			const day = two(dateValue.getDate());
			const hours = two(dateValue.getHours());
			const minutes = two(dateValue.getMinutes());
			return `${year}-${month}-${day}T${hours}:${minutes}`;
		}

		function getRemainingText(now, end) {
			const diff = end.getTime() - now.getTime();
			const abs = Math.abs(diff);
			const minuteMs = 60 * 1000;
			const hourMs = 60 * minuteMs;
			const dayMs = 24 * hourMs;

			if (Math.abs(diff) < minuteMs) {
				return "Due now!";
			}

			if (diff > 0) {
				if (abs >= dayMs) {
					return `Due in ${pluralize(Math.floor(abs / dayMs), "day")}`;
				}
				if (abs >= hourMs) {
					return `Due in ${pluralize(Math.floor(abs / hourMs), "hour")}`;
				}
				return `Due in ${pluralize(Math.max(1, Math.floor(abs / minuteMs)), "minute")}`;
			}

			if (abs >= dayMs) {
				return `Overdue by ${pluralize(Math.floor(abs / dayMs), "day")}`;
			}
			if (abs >= hourMs) {
				return `Overdue by ${pluralize(Math.floor(abs / hourMs), "hour")}`;
			}
			return `Overdue by ${pluralize(Math.max(1, Math.floor(abs / minuteMs)), "minute")}`;
		}

		function syncTimer() {
			if (state.status === "Done") {
				if (timerId) {
					clearInterval(timerId);
					timerId = null;
				}
				return;
			}

			if (!timerId) {
				timerId = setInterval(updateTime, 30000);
			}
		}

		function updateTime() {
			dueDateDisplay.dateTime = state.dueDate.toISOString();
			dueDateDisplay.textContent = formatDeadline(state.dueDate);

			if (state.status === "Done") {
				timeRemainingDisplay.textContent = "Completed";
				overdueIndicator.textContent = "Completed";
				overdueIndicator.classList.remove("active");
				card.classList.remove("overdue");
				return;
			}

			const now = new Date();
			const remainingText = getRemainingText(now, state.dueDate);
			const isOverdue = now.getTime() > state.dueDate.getTime();

			timeRemainingDisplay.textContent = remainingText;
			overdueIndicator.textContent = isOverdue ? "Overdue" : "On track";
			overdueIndicator.classList.toggle("active", isOverdue);
			card.classList.toggle("overdue", isOverdue);
		}

		function refreshCollapsible(forceCollapseIfLong) {
			const isLong = state.description.length > COLLAPSE_THRESHOLD;

			if (!isLong) {
				state.isExpanded = true;
				expandToggle.classList.add("is-hidden");
			} else {
				expandToggle.classList.remove("is-hidden");
				if (forceCollapseIfLong) {
					state.isExpanded = false;
				}
			}

			const expanded = !isLong ? true : state.isExpanded;
			expandToggle.setAttribute("aria-expanded", expanded ? "true" : "false");
			expandToggle.textContent = expanded ? "Collapse description" : "Expand description";
			collapsible.classList.toggle("collapsed", !expanded && isLong);
		}

		function setStatus(nextStatus) {
			state.status = nextStatus;
			if (state.status === "Done") {
				completeToggle.checked = true;
			} else if (completeToggle.checked) {
				completeToggle.checked = false;
			}
			statusControl.value = state.status;
			renderState();
		}

		function renderState(forceCollapseIfLong = false) {
			const priorityClass = toPriorityClass(state.priority);
			const statusClass = toStatusClass(state.status);

			titleElement.textContent = state.title;
			descriptionElement.textContent = state.description;

			priorityBadge.textContent = state.priority;
			priorityBadge.setAttribute("aria-label", `Todo priority ${state.priority}`);

			priorityIndicator.className = `priority-indicator ${priorityClass}`;
			priorityIndicator.setAttribute("aria-label", `Priority indicator ${state.priority}`);

			statusBadge.textContent = state.status;
			statusBadge.className = `badge status-badge ${statusClass}`;
			statusBadge.setAttribute("aria-label", `Todo status ${state.status}`);

			titleElement.classList.toggle("done", state.status === "Done");
			card.classList.toggle("done", state.status === "Done");

			statusControl.value = state.status;
			completeToggle.checked = state.status === "Done";

			card.classList.remove("priority-low", "priority-medium", "priority-high");
			card.classList.add(`priority-${priorityClass}`);

			refreshCollapsible(forceCollapseIfLong);
			updateTime();
			syncTimer();
		}

		function openEditMode() {
			state.isEditing = true;
			viewMode.classList.add("is-hidden");
			editForm.classList.remove("is-hidden");

			editTitleInput.value = state.title;
			editDescriptionInput.value = state.description;
			editPriorityInput.value = state.priority;
			editDueDateInput.value = formatForInput(state.dueDate);

			editTitleInput.focus();
		}

		function closeEditMode(restoreFocus) {
			state.isEditing = false;
			editForm.classList.add("is-hidden");
			viewMode.classList.remove("is-hidden");
			if (restoreFocus) {
				editButton.focus();
			}
		}

		completeToggle.addEventListener("change", (event) => {
			if (event.target.checked) {
				setStatus("Done");
			} else if (state.status === "Done") {
				setStatus("Pending");
			}
		});

		statusControl.addEventListener("change", (event) => {
			setStatus(event.target.value);
		});

		expandToggle.addEventListener("click", () => {
			state.isExpanded = !state.isExpanded;
			refreshCollapsible(false);
		});

		editButton.addEventListener("click", openEditMode);

		deleteButton.addEventListener("click", () => {
			alert("Delete clicked");
		});

		cancelButton.addEventListener("click", () => {
			closeEditMode(true);
		});

		editForm.addEventListener("submit", (event) => {
			event.preventDefault();

			const nextDueDate = new Date(editDueDateInput.value);
			if (Number.isNaN(nextDueDate.getTime())) {
				editDueDateInput.focus();
				return;
			}

			state.title = editTitleInput.value.trim() || state.title;
			state.description = editDescriptionInput.value.trim() || state.description;
			state.priority = editPriorityInput.value;
			state.dueDate = nextDueDate;

			renderState(true);
			closeEditMode(true);
		});

		editForm.addEventListener("keydown", (event) => {
			if (event.key !== "Tab") {
				return;
			}

			const focusable = editForm.querySelectorAll("input, textarea, select, button");
			const first = focusable[0];
			const last = focusable[focusable.length - 1];

			if (event.shiftKey && document.activeElement === first) {
				event.preventDefault();
				last.focus();
			} else if (!event.shiftKey && document.activeElement === last) {
				event.preventDefault();
				first.focus();
			}
		});

		renderState(true);
	</script>
</body>
</html>
